<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蔵書ライブラリ</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --accent: #4a6fa5;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --border: #e6e2da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); margin-top: 2px; }
  button.sync {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  button.sync:disabled { opacity: 0.5; }
  main { padding: 8px 10px 60px; }
  details.folder {
    margin: 4px 0;
    border-radius: 8px;
  }
  details.folder > summary {
    padding: 8px 10px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    background: #f0ede6;
    border-radius: 8px;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  details.folder[open] > summary { border-radius: 8px 8px 0 0; }
  .folder-children { padding-left: 14px; border-left: 2px solid var(--border); margin-left: 6px; }
  .book-card {
    display: flex; gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin: 6px 0;
    align-items: center;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .book-card img {
    width: 48px; height: 68px; object-fit: cover;
    border-radius: 4px; background: #ddd; flex-shrink: 0;
  }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 14px; font-weight: 600; overflow-wrap: break-word; }
  .book-author { font-size: 12px; color: var(--muted); }
  .store-links { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .store-links a {
    font-size: 12px; text-decoration: none;
    padding: 4px 8px; border-radius: 6px;
    background: #eef2f8; color: var(--accent); border: 1px solid #d6e0ee;
    -webkit-user-select: text; user-select: text;
  }
  .flag { font-size: 11px; color: #b5651d; margin-top: 4px; }
  #empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }

  /* 長押しで開く分類修正モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 14px 14px 0 0; padding: 16px;
    max-height: 82vh; overflow: auto;
  }
  .modal-box h2 { font-size: 15px; margin: 0 0 10px; }
  .modal-breadcrumb {
    font-size: 13px; color: var(--muted); margin-bottom: 12px;
    word-break: break-all; background: #f5f3ee; padding: 8px 10px; border-radius: 8px;
  }
  .modal-box label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px;
  }
  .modal-box select, .modal-box input[type="text"] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; margin-bottom: 12px; background: #fff;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px; border-radius: 8px; border: none; font-size: 14px;
  }
  .modal-actions .cancel { background: #eee; color: #333; }
  .modal-actions .submit { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <h1>蔵書ライブラリ</h1>
    <div id="status">読み込み中...</div>
  </div>
  <button class="sync" id="syncBtn" onclick="syncNow()">更新</button>
</header>

<div style="padding: 8px 10px 0;">
  <input type="search" id="searchBox" placeholder="タイトル・作者で検索" autocomplete="off"
    style="width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #e6e2da; border-radius:8px; font-size:14px;">
</div>

<main id="app"></main>

<!-- 本カード・フォルダを長押し(またはPCでは右クリック)すると開く分類修正モーダル -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal-box">
    <h2 id="editModalTitle">分類を変更</h2>
    <div class="modal-breadcrumb" id="editModalCurrent"></div>

    <label for="editPathSelect">既存のフォルダから選ぶ</label>
    <select id="editPathSelect">
      <option value="">-- 選択してください --</option>
    </select>

    <label for="editPathInput">または直接入力(「/」区切り。例: 漫画/少年漫画/少年ジャンプ/るろうに剣心)</label>
    <input type="text" id="editPathInput" placeholder="漫画/少年漫画/少年ジャンプ/るろうに剣心">

    <div class="modal-actions">
      <button class="cancel" onclick="closeEditModal()">キャンセル</button>
      <button class="submit" onclick="submitEdit()">送信</button>
    </div>
  </div>
</div>

<script>
/* ==== 設定:GASのWebアプリURLをここに貼る ==== */
const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxYkOEGfLsHuXJ2MOfbU0IG5boxQEBKs209w57F77MHSckLcgPKOdB4IQr5rrEP1REKrw/exec';

const LS_KEY = 'booklib_data_v1';
const LS_TS_KEY = 'booklib_updated_v1';

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveLocal(data) {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  localStorage.setItem(LS_TS_KEY, new Date().toISOString());
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

// フォルダパス("漫画/少年漫画/...")からツリー構造を組み立てる
function buildTree(rows) {
  const root = { children: {}, books: [] };
  rows.forEach(function (row) {
    const path = String(row['フォルダパス'] || '').split('/').filter(Boolean);
    let node = root;
    path.forEach(function (segment) {
      if (!node.children[segment]) node.children[segment] = { children: {}, books: [] };
      node = node.children[segment];
    });
    node.books.push(row);
  });
  return root;
}

function bookCardHtml(row) {
  const cover = row['Kindle_表紙URL'] || row['BW_表紙URL'] || row['BL_表紙URL'] || '';
  const links = [];
  if (row['Kindle_URL']) links.push('<a href="' + row['Kindle_URL'] + '" target="_blank" rel="noopener">Kindleで開く</a>');
  if (row['BW_URL']) links.push('<a href="' + row['BW_URL'] + '" target="_blank" rel="noopener">BOOK☆WALKERで開く</a>');
  if (row['BL_URL']) links.push('<a href="' + row['BL_URL'] + '" target="_blank" rel="noopener">BookLiveで開く</a>');
  const flag = row['統合候補フラグ'] ? '<div class="flag">⚠ ' + escapeHtml(row['統合候補フラグ']) + '</div>' : '';
  return (
    '<div class="book-card" data-id="' + escapeHtml(row['id'] || '') + '" data-path="' + escapeHtml(row['フォルダパス'] || '') + '">' +
      (cover ? '<img loading="lazy" src="' + cover + '" alt="">' : '<div style="width:48px;height:68px;background:#ddd;border-radius:4px;flex-shrink:0;"></div>') +
      '<div class="book-info">' +
        '<div class="book-title">' + escapeHtml(row['タイトル'] || '(無題)') + '</div>' +
        (row['作者'] ? '<div class="book-author">' + escapeHtml(row['作者']) + '</div>' : '') +
        '<div class="store-links">' + links.join('') + '</div>' +
        flag +
      '</div>' +
    '</div>'
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// parentPathを引き継いでこのフォルダのフルパス(スプレッドシートの「フォルダパス」列と同じ形式)を組み立てる
function renderNode(name, node, isRoot, parentPath) {
  let html = '';
  const fullPath = parentPath ? parentPath + '/' + name : name;
  if (!isRoot) {
    html += '<details class="folder"><summary data-path="' + escapeHtml(fullPath) + '">📁 ' + escapeHtml(name) + '</summary><div class="folder-children">';
  }
  Object.keys(node.children).sort().forEach(function (childName) {
    html += renderNode(childName, node.children[childName], false, fullPath);
  });
  node.books.forEach(function (b) { html += bookCardHtml(b); });
  if (!isRoot) html += '</div></details>';
  return html;
}

let currentRows = []; // 検索フィルタのために現在表示中のデータを保持しておく

function render(rows) {
  currentRows = rows;
  renderFiltered(document.getElementById('searchBox').value);
}

function renderFiltered(query) {
  const app = document.getElementById('app');
  try {
    if (!currentRows.length) {
      app.innerHTML = '<div id="empty">まだデータがありません。「更新」を押してWi-Fi環境で読み込んでください。</div>';
      return;
    }

    // 全角スペースも区切りとして扱い、前後の空白を除去
    const q = (query || '').replace(/\u3000/g, ' ').trim().toLowerCase();

    if (q) {
      // 検索中はフォルダ分けせず、一致した本だけを一覧表示する
      const matched = currentRows.filter(function (r) {
        const title = String(r['タイトル'] || '').toLowerCase();
        const author = String(r['作者'] || '').toLowerCase();
        const series = String(r['シリーズ名'] || '').toLowerCase();
        return title.indexOf(q) !== -1 || author.indexOf(q) !== -1 || series.indexOf(q) !== -1;
      });
      let html = '<div style="padding:4px 0 8px; font-size:13px; color:#8a8a8a;">' + matched.length + '件ヒット</div>';
      if (!matched.length) {
        html += '<div id="empty">一致する本が見つかりませんでした。</div>';
      } else {
        matched.forEach(function (b) { html += bookCardHtml(b); });
      }
      app.innerHTML = html;
      return;
    }

    const tree = buildTree(currentRows);
    // 未分類(フォルダパス無し)は先頭にまとめて表示
    const uncategorized = tree.books;
    let html = '';
    if (uncategorized.length) {
      html += '<details class="folder" open><summary>📂 未分類(' + uncategorized.length + ')</summary><div class="folder-children">';
      uncategorized.forEach(function (b) { html += bookCardHtml(b); });
      html += '</div></details>';
    }
    Object.keys(tree.children).sort().forEach(function (name) {
      html += renderNode(name, tree.children[name], false, '');
    });
    app.innerHTML = html;
  } catch (e) {
    // 検索処理でエラーが起きても画面が固まらないよう、原因を表示する
    console.error('renderFiltered error', e);
    setStatus('検索処理でエラーが発生しました: ' + e.message);
  }
}

function onSearchInput() {
  renderFiltered(searchBoxEl.value);
}

// oninput属性ではなく addEventListener で複数イベントに登録することで、
// 一部のブラウザ/WebViewで input イベントが安定して発火しない場合にも対応する
const searchBoxEl = document.getElementById('searchBox');
['input', 'keyup', 'change', 'compositionend'].forEach(function (evtName) {
  searchBoxEl.addEventListener(evtName, onSearchInput);
});

// ------------------------------------------------------------------
// 長押し(またはPCでの右クリック)で分類修正モーダルを開く
// ------------------------------------------------------------------
let pressTimer = null;
let pressTriggered = false;

function attachLongPressHandlers() {
  const app = document.getElementById('app');

  const start = function (e) {
    pressTriggered = false;
    const card = e.target.closest('.book-card');
    const summary = e.target.closest('details.folder > summary');
    if (!card && !summary) return;
    pressTimer = setTimeout(function () {
      pressTriggered = true;
      if (card) {
        openBookEditor(card.dataset.id, card.dataset.path);
      } else if (summary) {
        openFolderEditor(summary.dataset.path);
      }
    }, 550);
  };
  const cancel = function () { clearTimeout(pressTimer); };

  app.addEventListener('touchstart', start, { passive: true });
  app.addEventListener('mousedown', start);
  ['touchend', 'touchmove', 'mouseup', 'mouseleave'].forEach(function (evt) {
    app.addEventListener(evt, cancel);
  });

  // PCでは右クリックでも同じモーダルを開けるようにする(長押しの代替)
  app.addEventListener('contextmenu', function (e) {
    const card = e.target.closest('.book-card');
    const summary = e.target.closest('details.folder > summary');
    if (card || summary) {
      e.preventDefault();
      if (card) openBookEditor(card.dataset.id, card.dataset.path);
      else openFolderEditor(summary.dataset.path);
    }
  });

  // 長押しが発火した直後の click(フォルダの開閉やリンクの誤発火)を1回だけ抑制する
  app.addEventListener('click', function (e) {
    if (pressTriggered) {
      e.preventDefault();
      e.stopPropagation();
      pressTriggered = false;
    }
  }, true);
}

let editTarget = null; // { type: 'book', id, oldPath } または { type: 'folder', oldPath }

function collectDistinctPaths() {
  const set = new Set();
  currentRows.forEach(function (r) {
    if (r['フォルダパス']) set.add(r['フォルダパス']);
  });
  return Array.from(set).sort();
}

function populatePathSelect(selectedPath) {
  const sel = document.getElementById('editPathSelect');
  sel.innerHTML = '<option value="">-- 選択してください --</option>';
  collectDistinctPaths().forEach(function (p) {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p.replace(/\//g, ' ＞ ');
    if (p === selectedPath) opt.selected = true;
    sel.appendChild(opt);
  });
}

function openBookEditor(id, currentPath) {
  editTarget = { type: 'book', id: id, oldPath: currentPath || '' };
  document.getElementById('editModalTitle').textContent = '本の分類を変更';
  document.getElementById('editModalCurrent').textContent =
    '現在: ' + (currentPath ? currentPath.replace(/\//g, ' ＞ ') : '(未分類)');
  populatePathSelect(currentPath);
  document.getElementById('editPathInput').value = currentPath || '';
  document.getElementById('editModal').classList.remove('hidden');
}

function openFolderEditor(path) {
  if (!path) return; // 「未分類」フォルダなど、パスを持たない見出しは対象外
  editTarget = { type: 'folder', oldPath: path };
  document.getElementById('editModalTitle').textContent = 'フォルダごと分類を変更(配下の本すべてが対象)';
  document.getElementById('editModalCurrent').textContent = '現在: ' + path.replace(/\//g, ' ＞ ');
  populatePathSelect(path);
  document.getElementById('editPathInput').value = path;
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
  editTarget = null;
}

document.getElementById('editPathSelect').addEventListener('change', function () {
  if (this.value) document.getElementById('editPathInput').value = this.value;
});

async function submitEdit() {
  if (!editTarget) return;
  const newPath = document.getElementById('editPathInput').value.trim().replace(/^\/+|\/+$/g, '');
  if (!newPath) { alert('フォルダパスを入力してください。'); return; }

  const payload = editTarget.type === 'book'
    ? { action: 'moveBook', id: editTarget.id, newPath: newPath }
    : { action: 'moveFolder', oldPath: editTarget.oldPath, newPath: newPath };

  setStatus('スプレッドシートに反映しています...');
  try {
    const res = await fetch(GAS_WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflightを避けるためtext/plainで送る(doPost側でJSONとしてparseする)
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '不明なエラー');

    // スプレッドシート側と同じ内容でローカルのキャッシュも更新し、画面に即反映する
    const rows = loadLocal();
    if (editTarget.type === 'book') {
      rows.forEach(function (r) { if (String(r['id']) === String(editTarget.id)) r['フォルダパス'] = newPath; });
    } else {
      const oldPath = editTarget.oldPath;
      rows.forEach(function (r) {
        const p = String(r['フォルダパス'] || '');
        if (p === oldPath) r['フォルダパス'] = newPath;
        else if (p.indexOf(oldPath + '/') === 0) r['フォルダパス'] = newPath + p.slice(oldPath.length);
      });
    }
    saveLocal(rows);
    render(rows);
    closeEditModal();
    setStatus('分類を変更しました: ' + new Date().toLocaleString('ja-JP'));
  } catch (e) {
    setStatus('変更の送信に失敗しました: ' + e.message);
    alert('送信に失敗しました。Wi-Fi環境を確認して、もう一度お試しください。(' + e.message + ')');
  }
}

async function syncNow() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  setStatus('通信中... データを取得しています');
  try {
    const res = await fetch(GAS_WEBAPP_URL, { cache: 'no-store' });
    const data = await res.json();
    saveLocal(data);

    // 表紙画像をservice worker経由でキャッシュ(表示することでcache-first fetchが走る)
    setStatus('画像をキャッシュしています... (' + data.length + '冊)');
    render(data);

    setStatus('更新完了: ' + new Date().toLocaleString('ja-JP'));
  } catch (e) {
    setStatus('更新に失敗しました: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

function init() {
  const rows = loadLocal();
  const ts = localStorage.getItem(LS_TS_KEY);
  setStatus(ts ? ('最終更新: ' + new Date(ts).toLocaleString('ja-JP')) : 'まだ更新されていません');
  render(rows);
  attachLongPressHandlers();

  if ('serviceWorker' in navigator) {
    // updateViaCache:'none' + update() で、sw.js自体が古いままキャッシュされて
    // 修正が反映されない事態を防ぐ(インストール済みPWAでよくある「直したのに変わらない」原因)
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
    }).catch(function (e) {
      console.warn('service worker登録失敗', e);
    });
  }
}

init();
</script>
</body>
</html>
