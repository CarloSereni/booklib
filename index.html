<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蔵書ライブラリ</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --accent: #4a6fa5;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --border: #e6e2da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); margin-top: 2px; }
  button.sync {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 14px;
  }
  button.sync:disabled { opacity: 0.5; }
  main { padding: 8px 10px 60px; }
  details.folder {
    margin: 4px 0;
    border-radius: 8px;
  }
  details.folder > summary {
    padding: 8px 10px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    background: #f0ede6;
    border-radius: 8px;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  details.folder[open] > summary { border-radius: 8px 8px 0 0; }
  .folder-children { padding-left: 14px; border-left: 2px solid var(--border); margin-left: 6px; }
  .book-card {
    display: flex; gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin: 6px 0;
    align-items: center;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .book-card img {
    width: 48px; height: 68px; object-fit: cover;
    border-radius: 4px; background: #ddd; flex-shrink: 0;
  }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 14px; font-weight: 600; overflow-wrap: break-word; }
  .book-author { font-size: 12px; color: var(--muted); }
  .store-links { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .store-links a {
    font-size: 12px; text-decoration: none;
    padding: 4px 8px; border-radius: 6px;
    background: #eef2f8; color: var(--accent); border: 1px solid #d6e0ee;
    -webkit-user-select: text; user-select: text;
  }
  .flag { font-size: 11px; color: #b5651d; margin-top: 4px; }
  #empty { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }

  /* 長押しで開く分類修正モーダル */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 14px 14px 0 0; padding: 16px;
    max-height: 82vh; overflow: auto;
  }
  .modal-box h2 { font-size: 15px; margin: 0 0 10px; }
  .modal-breadcrumb {
    font-size: 13px; color: var(--muted); margin-bottom: 12px;
    word-break: break-all; background: #f5f3ee; padding: 8px 10px; border-radius: 8px;
  }
  .modal-box label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px;
  }
  .modal-box select, .modal-box input[type="text"] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; margin-bottom: 12px; background: #fff;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    padding: 9px 16px; border-radius: 8px; border: none; font-size: 14px;
  }
  .modal-actions .cancel { background: #eee; color: #333; }
  .modal-actions .submit { background: var(--accent); color: #fff; }

  /* 統合(マージ)モード */
  button.merge-toggle {
    background: #fff; color: var(--accent); border: 1px solid var(--accent);
    padding: 7px 10px; border-radius: 8px; font-size: 12px; margin-right: 6px;
    white-space: nowrap;
  }
  button.merge-toggle.active { background: var(--accent); color: #fff; }
  .header-actions { display: flex; align-items: center; flex-shrink: 0; }

  .merge-bar {
    background: #fff7e6; border-bottom: 1px solid var(--border);
    padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
    font-size: 13px;
  }
  .merge-bar.hidden { display: none; }
  .merge-bar-actions button {
    margin-left: 8px; padding: 6px 12px; border-radius: 8px; border: none; font-size: 13px;
  }
  .merge-bar-actions button:first-child { background: #eee; color: #333; }
  .merge-bar-actions button:last-child { background: var(--accent); color: #fff; }
  .merge-bar-actions button:disabled { opacity: 0.4; }

  .book-card.selected { border-color: var(--accent); border-width: 2px; background: #eef2f8; }

  .merge-books { display: flex; gap: 10px; margin-bottom: 12px; }
  .merge-book-preview { flex: 1; text-align: center; font-size: 12px; }
  .merge-book-preview img { width: 56px; height: 80px; object-fit: cover; border-radius: 6px; background: #ddd; }
  .merge-book-noimg { width: 56px; height: 80px; border-radius: 6px; background: #ddd; margin: 0 auto; }
  .merge-book-label { font-weight: 700; margin-bottom: 4px; }
  .merge-book-title { font-size: 12px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .merge-book-stores { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .merge-field { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .merge-field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .merge-field-fixed { font-size: 14px; }
  .merge-radio { display: block; font-size: 13px; margin-bottom: 4px; }
  .merge-source { color: var(--muted); font-size: 11px; }
  .merge-note { font-size: 12px; color: #b5651d; margin: 10px 0; }

  /* 移動モード(複数選択して一括でフォルダ変更) */
  .move-bar {
    background: #eaf5ec; border-bottom: 1px solid var(--border);
    padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
    font-size: 13px;
  }
  .move-bar.hidden { display: none; }
  .move-bar-actions button {
    margin-left: 8px; padding: 6px 12px; border-radius: 8px; border: none; font-size: 13px;
  }
  .move-bar-actions button:first-child { background: #eee; color: #333; }
  .move-bar-actions button:last-child { background: var(--accent); color: #fff; }
  .move-bar-actions button:disabled { opacity: 0.4; }

  .move-book-list {
    max-height: 120px; overflow: auto; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 12px; font-size: 13px; background: #fafafa;
  }
  .move-book-list ul { margin: 0; padding-left: 18px; }
  .move-book-list li { margin-bottom: 2px; }

  /* タップで展開/折りたたみできるツリー式フォルダピッカー */
  .folder-tree-picker {
    max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; margin-bottom: 12px; background: #fafafa;
  }
  .tree-node { margin-left: 2px; }
  .tree-row { display: flex; align-items: center; cursor: pointer; border-radius: 6px; }
  .tree-row:active { background: #eef2f8; }
  .tree-toggle {
    width: 22px; flex-shrink: 0; font-size: 11px; color: var(--muted);
    text-align: center; padding: 8px 0; cursor: pointer;
  }
  .tree-toggle-spacer { width: 22px; flex-shrink: 0; }
  .tree-label {
    font-size: 13px; padding: 7px 6px; border-radius: 6px; flex: 1; cursor: pointer;
  }
  .tree-label:active { background: #eef2f8; }
  .tree-label.tree-selected { background: #dbe6f5; font-weight: 600; }
  .tree-children { margin-left: 18px; border-left: 1px dashed var(--border); padding-left: 4px; }
  .tree-children.hidden { display: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>蔵書ライブラリ</h1>
    <div id="status">読み込み中...</div>
  </div>
  <div class="header-actions">
    <button class="merge-toggle" id="mergeModeBtn" onclick="enterSelectionMode('merge')">統合</button>
    <button class="merge-toggle" id="moveModeBtn" onclick="enterSelectionMode('move')">移動</button>
    <button class="sync" id="syncBtn" onclick="syncNow()">更新</button>
  </div>
</header>

<div class="merge-bar hidden" id="mergeBar">
  <span id="mergeBarStatus">0/2冊選択中</span>
  <div class="merge-bar-actions">
    <button onclick="exitSelectionMode()">キャンセル</button>
    <button id="mergeGoBtn" onclick="startMergeConfirm()" disabled>統合する</button>
  </div>
</div>

<div class="move-bar hidden" id="moveBar">
  <span id="moveBarStatus">0冊選択中</span>
  <div class="move-bar-actions">
    <button onclick="exitSelectionMode()">キャンセル</button>
    <button id="moveGoBtn" onclick="startBulkMoveConfirm()" disabled>移動する</button>
  </div>
</div>

<div style="padding: 8px 10px 0; display:flex; gap:8px;">
  <input type="search" id="searchBox" placeholder="タイトル・作者で検索" autocomplete="off"
    style="flex:1; min-width:0; box-sizing:border-box; padding:8px 10px; border:1px solid #e6e2da; border-radius:8px; font-size:14px;">
  <button id="searchBtn" onclick="runSearch()"
    style="flex-shrink:0; padding:8px 16px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:14px;">検索</button>
</div>

<main id="app"></main>

<!-- 本カード・フォルダを長押し(またはPCでは右クリック)すると開く分類修正モーダル -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal-box">
    <h2 id="editModalTitle">分類を変更</h2>
    <div class="modal-breadcrumb" id="editModalCurrent"></div>

    <label>既存のフォルダから選ぶ(タップで展開/選択)</label>
    <div class="folder-tree-picker" id="editPathTree"></div>

    <label for="editPathInput">または直接入力(「/」区切り。例: 漫画/少年漫画/少年ジャンプ/るろうに剣心)</label>
    <input type="text" id="editPathInput" placeholder="漫画/少年漫画/少年ジャンプ/るろうに剣心">

    <div class="modal-actions">
      <button class="cancel" onclick="closeEditModal()">キャンセル</button>
      <button class="submit" onclick="submitEdit()">送信</button>
    </div>
  </div>
</div>

<!-- 統合(マージ)の最終確認モーダル。中身はJSで動的に生成する -->
<div class="modal-overlay hidden" id="mergeModal">
  <div class="modal-box" id="mergeModalBox"></div>
</div>

<!-- 複数選択して一括でフォルダを移動する確認モーダル。中身はJSで動的に生成する -->
<div class="modal-overlay hidden" id="moveModal">
  <div class="modal-box" id="moveModalBox"></div>
</div>

<script>
/* ==== 設定:GASのWebアプリURLをここに貼る ==== */
const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxYkOEGfLsHuXJ2MOfbU0IG5boxQEBKs209w57F77MHSckLcgPKOdB4IQr5rrEP1REKrw/exec';

const LS_KEY = 'booklib_data_v1';
const LS_TS_KEY = 'booklib_updated_v1';

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveLocal(data) {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  localStorage.setItem(LS_TS_KEY, new Date().toISOString());
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

// フォルダパス("漫画/少年漫画/...")からツリー構造を組み立てる
function buildTree(rows) {
  const root = { children: {}, books: [] };
  rows.forEach(function (row) {
    const path = String(row['フォルダパス'] || '').split('/').filter(Boolean);
    let node = root;
    path.forEach(function (segment) {
      if (!node.children[segment]) node.children[segment] = { children: {}, books: [] };
      node = node.children[segment];
    });
    node.books.push(row);
  });
  return root;
}

function bookCardHtml(row) {
  const cover = row['Kindle_表紙URL'] || row['BW_表紙URL'] || row['BL_表紙URL'] || '';
  const links = [];
  if (row['Kindle_URL']) links.push('<a href="' + row['Kindle_URL'] + '" target="_blank" rel="noopener">Kindleで開く</a>');
  if (row['BW_URL']) links.push('<a href="' + row['BW_URL'] + '" target="_blank" rel="noopener">BOOK☆WALKERで開く</a>');
  if (row['BL_URL']) links.push('<a href="' + row['BL_URL'] + '" target="_blank" rel="noopener">BookLiveで開く</a>');
  const flag = row['統合候補フラグ'] ? '<div class="flag">⚠ ' + escapeHtml(row['統合候補フラグ']) + '</div>' : '';
  return (
    '<div class="book-card" data-id="' + escapeHtml(row['id'] || '') + '" data-path="' + escapeHtml(row['フォルダパス'] || '') + '">' +
      (cover ? '<img loading="lazy" src="' + cover + '" alt="">' : '<div style="width:48px;height:68px;background:#ddd;border-radius:4px;flex-shrink:0;"></div>') +
      '<div class="book-info">' +
        '<div class="book-title">' + escapeHtml(row['タイトル'] || '(無題)') + '</div>' +
        (row['作者'] ? '<div class="book-author">' + escapeHtml(row['作者']) + '</div>' : '') +
        '<div class="store-links">' + links.join('') + '</div>' +
        flag +
      '</div>' +
    '</div>'
  );
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// GAS_WEBAPP_URLへの通信をまとめる共通関数。
// GAS側がエラーになるとJSONではなくHTMLのエラーページ/ログイン画面が返ってくることがあるため、
// その場合は原因が分かりやすいメッセージに変換してから投げる
async function fetchGasJson(options) {
  const res = await fetch(GAS_WEBAPP_URL, options);
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    if (text.trim().indexOf('<') === 0) {
      throw new Error(
        'サーバーからHTMLが返ってきました(JSONではありません)。GASを再デプロイ済みか、' +
        'デプロイの公開設定(アクセスできるユーザー)をご確認ください。'
      );
    }
    throw new Error('サーバーの応答を解析できませんでした: ' + text.slice(0, 200));
  }
}

// parentPathを引き継いでこのフォルダのフルパス(スプレッドシートの「フォルダパス」列と同じ形式)を組み立てる
function renderNode(name, node, isRoot, parentPath) {
  let html = '';
  const fullPath = parentPath ? parentPath + '/' + name : name;
  if (!isRoot) {
    html += '<details class="folder" data-path="' + escapeHtml(fullPath) + '"><summary data-path="' + escapeHtml(fullPath) + '">📁 ' + escapeHtml(name) + '</summary><div class="folder-children">';
  }
  Object.keys(node.children).sort().forEach(function (childName) {
    html += renderNode(childName, node.children[childName], false, fullPath);
  });
  node.books.forEach(function (b) { html += bookCardHtml(b); });
  if (!isRoot) html += '</div></details>';
  return html;
}

let currentRows = []; // 検索フィルタのために現在表示中のデータを保持しておく
let activeSearchQuery = ''; // 「検索」ボタンを押すまでは更新されない(リアルタイム検索はしない)
let openFolderPaths = new Set(); // 開いているフォルダのフォルダパスを記録(更新・統合後も状態を保つため)
let uncategorizedOpen = true; // 「未分類」フォルダの開閉状態

// 更新・統合でデータが差し替わっても、スクロール位置とフォルダの開閉状態を保つ
function render(rows) {
  const scrollY = window.scrollY;
  currentRows = rows;
  renderFiltered(activeSearchQuery);
  applyFolderOpenStates();
  window.scrollTo(0, scrollY);
}

// フォルダの開閉を切り替えた際に状態を記録しておく(toggleイベントはbubbleしないが、
// キャプチャフェーズはbubbleしないイベントでも祖先要素まで伝わるためcapture:trueで拾う)
document.getElementById('app').addEventListener('toggle', function (e) {
  const details = e.target;
  if (!details.classList || !details.classList.contains('folder')) return;
  if (details.id === 'uncategorizedFolder') {
    uncategorizedOpen = details.open;
    return;
  }
  const path = details.dataset.path;
  if (!path) return;
  if (details.open) openFolderPaths.add(path); else openFolderPaths.delete(path);
}, true);

// 直前に記録した開閉状態を、新しく描画したDOMに反映する
function applyFolderOpenStates() {
  const uncategorizedEl = document.getElementById('uncategorizedFolder');
  if (uncategorizedEl) uncategorizedEl.open = uncategorizedOpen;
  document.querySelectorAll('#app details.folder[data-path]').forEach(function (el) {
    if (openFolderPaths.has(el.dataset.path)) el.open = true;
  });
}

function renderFiltered(query) {
  const app = document.getElementById('app');
  try {
    if (!currentRows.length) {
      app.innerHTML = '<div id="empty">まだデータがありません。「更新」を押してWi-Fi環境で読み込んでください。</div>';
      return;
    }

    // 全角スペースも区切りとして扱い、前後の空白を除去
    const q = (query || '').replace(/\u3000/g, ' ').trim().toLowerCase();

    if (q) {
      // 検索中はフォルダ分けせず、一致した本だけを一覧表示する
      const matched = currentRows.filter(function (r) {
        const title = String(r['タイトル'] || '').toLowerCase();
        const author = String(r['作者'] || '').toLowerCase();
        const series = String(r['シリーズ名'] || '').toLowerCase();
        return title.indexOf(q) !== -1 || author.indexOf(q) !== -1 || series.indexOf(q) !== -1;
      });
      let html = '<div style="padding:4px 0 8px; font-size:13px; color:#8a8a8a;">' + matched.length + '件ヒット</div>';
      if (!matched.length) {
        html += '<div id="empty">一致する本が見つかりませんでした。</div>';
      } else {
        matched.forEach(function (b) { html += bookCardHtml(b); });
      }
      app.innerHTML = html;
      return;
    }

    const tree = buildTree(currentRows);
    // 未分類(フォルダパス無し)は先頭にまとめて表示
    const uncategorized = tree.books;
    let html = '';
    if (uncategorized.length) {
      html += '<details class="folder" id="uncategorizedFolder"><summary>📂 未分類(' + uncategorized.length + ')</summary><div class="folder-children">';
      uncategorized.forEach(function (b) { html += bookCardHtml(b); });
      html += '</div></details>';
    }
    Object.keys(tree.children).sort().forEach(function (name) {
      html += renderNode(name, tree.children[name], false, '');
    });
    app.innerHTML = html;
  } catch (e) {
    // 検索処理でエラーが起きても画面が固まらないよう、原因を表示する
    console.error('renderFiltered error', e);
    setStatus('検索処理でエラーが発生しました: ' + e.message);
  }
}

// 「検索」ボタンを押した時(またはEnterキー)だけ検索を実行する(入力の都度は検索しない)
function runSearch() {
  activeSearchQuery = searchBoxEl.value;
  const scrollY = window.scrollY;
  renderFiltered(activeSearchQuery);
  applyFolderOpenStates();
  window.scrollTo(0, scrollY);
}

const searchBoxEl = document.getElementById('searchBox');
searchBoxEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
});

// ------------------------------------------------------------------
// 長押し(またはPCでの右クリック)で分類修正モーダルを開く
// ------------------------------------------------------------------
let pressTimer = null;
let pressTriggered = false;

function attachLongPressHandlers() {
  const app = document.getElementById('app');

  const start = function (e) {
    if (activeSelectionMode) return; // 統合/移動モード中は長押しでの分類修正モーダルを開かない
    pressTriggered = false;
    const card = e.target.closest('.book-card');
    const summary = e.target.closest('details.folder > summary');
    if (!card && !summary) return;
    pressTimer = setTimeout(function () {
      pressTriggered = true;
      if (card) {
        openBookEditor(card.dataset.id, card.dataset.path);
      } else if (summary) {
        openFolderEditor(summary.dataset.path);
      }
    }, 550);
  };
  const cancel = function () { clearTimeout(pressTimer); };

  app.addEventListener('touchstart', start, { passive: true });
  app.addEventListener('mousedown', start);
  ['touchend', 'touchmove', 'mouseup', 'mouseleave'].forEach(function (evt) {
    app.addEventListener(evt, cancel);
  });

  // PCでは右クリックでも同じモーダルを開けるようにする(長押しの代替)
  app.addEventListener('contextmenu', function (e) {
    const card = e.target.closest('.book-card');
    const summary = e.target.closest('details.folder > summary');
    if (card || summary) {
      e.preventDefault();
      if (card) openBookEditor(card.dataset.id, card.dataset.path);
      else openFolderEditor(summary.dataset.path);
    }
  });

  // 長押しが発火した直後の click(フォルダの開閉やリンクの誤発火)を1回だけ抑制する
  app.addEventListener('click', function (e) {
    if (pressTriggered) {
      e.preventDefault();
      e.stopPropagation();
      pressTriggered = false;
    }
  }, true);

  // 統合/移動モード中は、本カードをタップすると(リンクを踏まずに)選択/解除する
  app.addEventListener('click', function (e) {
    if (!activeSelectionMode) return;
    const card = e.target.closest('.book-card');
    if (!card) return;
    e.preventDefault();
    e.stopPropagation();
    toggleBookSelection(card);
  }, true);
}

// ------------------------------------------------------------------
// 複数選択モード(「統合」= 重複した本を2冊選んで1冊にまとめる /
//              「移動」= 好きな冊数を選んでフォルダパスを一括変更する)
// 2つのモードは同じ選択状態を共有し、同時には片方しか有効にならない
// ------------------------------------------------------------------
let activeSelectionMode = null; // 'merge' | 'move' | null
let selectedIds = []; // 選択中の本のid
let mergePair = null; // 統合の確認モーダル表示中に保持する { aId, bId }
let moveTargetBookIds = []; // 移動の確認モーダル表示中に保持する対象id一覧

const MERGE_FIELD_DEFS = [
  { key: 'タイトル', id: 'title', label: 'タイトル' },
  { key: '作者', id: 'author', label: '作者' },
  { key: 'シリーズ名', id: 'series', label: 'シリーズ名' },
  { key: '巻数', id: 'volume', label: '巻数' },
  { key: 'フォルダパス', id: 'folderPath', label: 'フォルダパス' },
  { key: 'レーベル', id: 'label', label: 'レーベル' }
];

// 既に同じモードが有効なら解除、違うモード(または未選択)なら切り替える
function enterSelectionMode(mode) {
  if (activeSelectionMode === mode) {
    exitSelectionMode();
    return;
  }
  activeSelectionMode = mode;
  selectedIds = [];
  document.querySelectorAll('.book-card.selected').forEach(function (el) { el.classList.remove('selected'); });
  updateSelectionModeUI();
}

function exitSelectionMode() {
  activeSelectionMode = null;
  selectedIds = [];
  document.querySelectorAll('.book-card.selected').forEach(function (el) { el.classList.remove('selected'); });
  updateSelectionModeUI();
}

function updateSelectionModeUI() {
  document.getElementById('mergeModeBtn').classList.toggle('active', activeSelectionMode === 'merge');
  document.getElementById('mergeModeBtn').textContent = activeSelectionMode === 'merge' ? '統合モード中' : '統合';
  document.getElementById('moveModeBtn').classList.toggle('active', activeSelectionMode === 'move');
  document.getElementById('moveModeBtn').textContent = activeSelectionMode === 'move' ? '移動モード中' : '移動';

  document.getElementById('mergeBar').classList.toggle('hidden', activeSelectionMode !== 'merge');
  document.getElementById('moveBar').classList.toggle('hidden', activeSelectionMode !== 'move');

  document.getElementById('mergeBarStatus').textContent = selectedIds.length + '/2冊選択中';
  document.getElementById('mergeGoBtn').disabled = selectedIds.length !== 2;

  document.getElementById('moveBarStatus').textContent = selectedIds.length + '冊選択中';
  document.getElementById('moveGoBtn').disabled = selectedIds.length === 0;
}

function toggleBookSelection(card) {
  const id = card.dataset.id;
  const idx = selectedIds.indexOf(id);
  if (idx !== -1) {
    selectedIds.splice(idx, 1);
    card.classList.remove('selected');
  } else {
    if (activeSelectionMode === 'merge' && selectedIds.length >= 2) {
      setStatus('統合できるのは2冊までです。');
      return;
    }
    selectedIds.push(id);
    card.classList.add('selected');
  }
  updateSelectionModeUI();
}

function collectStoreNames(book) {
  const names = [];
  if (book['Kindle_ASIN']) names.push('Kindle');
  if (book['BW_ID']) names.push('BOOK☆WALKER');
  if (book['BL_title_id'] && book['BL_vol_no']) names.push('BookLive');
  return names;
}

// 「統合する」ボタン: まずクライアント側で店の重複を軽くチェックしてから確認モーダルを開く
function startMergeConfirm() {
  if (activeSelectionMode !== 'merge' || selectedIds.length !== 2) return;
  const bookA = currentRows.find(function (r) { return String(r['id']) === selectedIds[0]; });
  const bookB = currentRows.find(function (r) { return String(r['id']) === selectedIds[1]; });
  if (!bookA || !bookB) { alert('選択した本が見つかりませんでした。「更新」してもう一度お試しください。'); return; }

  const conflicts = [];
  if (bookA['Kindle_ASIN'] && bookB['Kindle_ASIN']) conflicts.push('Kindle');
  if (bookA['BW_ID'] && bookB['BW_ID']) conflicts.push('BOOK☆WALKER');
  if (bookA['BL_title_id'] && bookA['BL_vol_no'] && bookB['BL_title_id'] && bookB['BL_vol_no']) conflicts.push('BookLive');
  if (conflicts.length) {
    alert('両方の本に同じ店(' + conflicts.join('、') + ')の情報が入っているため統合できません。');
    return;
  }

  openMergeConfirmModal(bookA, bookB);
}

// 「移動する」ボタン: 選択した本一覧から確認モーダルを開く
function startBulkMoveConfirm() {
  if (activeSelectionMode !== 'move' || selectedIds.length === 0) return;
  const books = selectedIds
    .map(function (id) { return currentRows.find(function (r) { return String(r['id']) === id; }); })
    .filter(Boolean);
  if (!books.length) { alert('選択した本が見つかりませんでした。「更新」してもう一度お試しください。'); return; }

  openMoveConfirmModal(books);
}

function mergeBookPreviewHtml(label, book, stores) {
  const cover = book['Kindle_表紙URL'] || book['BW_表紙URL'] || book['BL_表紙URL'] || '';
  return (
    '<div class="merge-book-preview">' +
      '<div class="merge-book-label">' + label + '</div>' +
      (cover ? '<img src="' + cover + '" alt="">' : '<div class="merge-book-noimg"></div>') +
      '<div class="merge-book-title">' + escapeHtml(book['タイトル'] || '(無題)') + '</div>' +
      '<div class="merge-book-stores">' + (stores.length ? escapeHtml(stores.join(' / ')) : '(店情報なし)') + '</div>' +
    '</div>'
  );
}

function openMergeConfirmModal(bookA, bookB) {
  mergePair = { aId: bookA['id'], bId: bookB['id'] };

  let fieldsHtml = '';
  MERGE_FIELD_DEFS.forEach(function (def) {
    const valA = bookA[def.key] || '';
    const valB = bookB[def.key] || '';
    if (valA === valB) {
      fieldsHtml +=
        '<div class="merge-field">' +
          '<div class="merge-field-label">' + def.label + '</div>' +
          '<div class="merge-field-fixed">' + (valA ? escapeHtml(valA) : '(空欄)') + '</div>' +
          '<input type="hidden" id="fixed_' + def.id + '" value="' + escapeHtml(valA) + '">' +
        '</div>';
      return;
    }
    fieldsHtml +=
      '<div class="merge-field">' +
        '<div class="merge-field-label">' + def.label + '(どちらを使いますか?)</div>' +
        '<label class="merge-radio"><input type="radio" name="field_' + def.id + '" value="' + escapeHtml(valA) + '" checked> ' +
          (valA ? escapeHtml(valA) : '(空欄)') + ' <span class="merge-source">[本A]</span></label>' +
        '<label class="merge-radio"><input type="radio" name="field_' + def.id + '" value="' + escapeHtml(valB) + '"> ' +
          (valB ? escapeHtml(valB) : '(空欄)') + ' <span class="merge-source">[本B]</span></label>' +
      '</div>';
  });

  const storesA = collectStoreNames(bookA);
  const storesB = collectStoreNames(bookB);

  const html =
    '<h2>この2冊を統合しますか?</h2>' +
    '<div class="merge-books">' +
      mergeBookPreviewHtml('本A', bookA, storesA) +
      mergeBookPreviewHtml('本B', bookB, storesB) +
    '</div>' +
    '<div class="merge-fields">' + fieldsHtml + '</div>' +
    '<div class="merge-note">統合すると本Bの行は削除され、本Aと本Bの情報を1冊分にまとめた1行だけが残ります。この操作は元に戻せません。</div>' +
    '<div class="modal-actions">' +
      '<button class="cancel" onclick="closeMergeModal()">キャンセル</button>' +
      '<button class="submit" onclick="confirmMergeSubmit()">この内容で統合する</button>' +
    '</div>';

  document.getElementById('mergeModalBox').innerHTML = html;
  document.getElementById('mergeModal').classList.remove('hidden');
}

function closeMergeModal() {
  document.getElementById('mergeModal').classList.add('hidden');
  mergePair = null;
}

async function confirmMergeSubmit() {
  if (!mergePair) return;
  const fields = {};
  MERGE_FIELD_DEFS.forEach(function (def) {
    const radios = document.getElementsByName('field_' + def.id);
    if (radios.length) {
      for (let i = 0; i < radios.length; i++) {
        if (radios[i].checked) { fields[def.key] = radios[i].value; break; }
      }
    } else {
      const fixed = document.getElementById('fixed_' + def.id);
      if (fixed) fields[def.key] = fixed.value;
    }
  });

  setStatus('統合しています...');
  try {
    const data = await fetchGasJson({
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'mergeBooks', keepId: mergePair.aId, removeId: mergePair.bId, fields: fields })
    });
    if (!data.ok) throw new Error(data.error || '不明なエラー');

    closeMergeModal();
    exitSelectionMode();
    setStatus('統合が完了しました。最新データを取得しています...');
    await syncNow();
  } catch (e) {
    setStatus('統合に失敗しました: ' + e.message);
    alert('統合に失敗しました。(' + e.message + ')');
  }
}

let editTarget = null; // { type: 'book', id, oldPath } または { type: 'folder', oldPath }

function collectDistinctPaths() {
  const set = new Set();
  currentRows.forEach(function (r) {
    if (r['フォルダパス']) set.add(r['フォルダパス']);
  });
  return Array.from(set).sort();
}

// ------------------------------------------------------------------
// タップで展開/折りたたみできるツリー式フォルダピッカー
// (単一編集モーダル・一括移動モーダルの両方から呼ばれる共通部品)
// ------------------------------------------------------------------
function buildFolderPathTree() {
  const root = { children: {} };
  collectDistinctPaths().forEach(function (p) {
    const segments = p.split('/').filter(Boolean);
    let node = root;
    segments.forEach(function (seg) {
      if (!node.children[seg]) node.children[seg] = { children: {} };
      node = node.children[seg];
    });
  });
  return root;
}

function buildFolderTreeNode(name, node, parentPath) {
  const fullPath = parentPath ? parentPath + '/' + name : name;
  const hasChildren = Object.keys(node.children).length > 0;
  let childrenHtml = '';
  Object.keys(node.children).sort().forEach(function (childName) {
    childrenHtml += buildFolderTreeNode(childName, node.children[childName], fullPath);
  });
  return (
    '<div class="tree-node">' +
      '<div class="tree-row">' +
        (hasChildren ? '<span class="tree-toggle">▶</span>' : '<span class="tree-toggle-spacer"></span>') +
        '<span class="tree-label" data-select-path="' + escapeHtml(fullPath) + '">📁 ' + escapeHtml(name) + '</span>' +
      '</div>' +
      '<div class="tree-children hidden">' + childrenHtml + '</div>' +
    '</div>'
  );
}

// containerId内にフォルダツリーを描画し、葉/枝どちらを選んでもonSelect(path)が呼ばれるようにする
function renderFolderTreePicker(containerId, onSelect) {
  const root = buildFolderPathTree();
  let html = '';
  Object.keys(root.children).sort().forEach(function (name) {
    html += buildFolderTreeNode(name, root.children[name], '');
  });
  const container = document.getElementById(containerId);
  container.innerHTML = html || '<div style="font-size:13px;color:var(--muted);padding:6px;">既存のフォルダがまだありません。下の欄に直接入力してください。</div>';

  // addEventListenerで毎回追加すると、モーダルを開くたびにハンドラが積み重なり
  // (このコンテナ自体は使い回されるため)開閉が効かなくなることがあるので、
  // onclickへの代入で常に1つだけに保つ
  container.onclick = function (e) {
    const row = e.target.closest('.tree-row');
    if (!row) return;
    const node = row.closest('.tree-node');
    const childrenEl = node.querySelector(':scope > .tree-children');
    const toggle = row.querySelector('.tree-toggle');
    const label = row.querySelector('.tree-label');

    // ▶だけでなく行のどこをタップしても、子フォルダがあれば展開/折りたたみする
    if (childrenEl && childrenEl.children.length > 0) {
      const wasHidden = childrenEl.classList.contains('hidden');
      childrenEl.classList.toggle('hidden');
      if (toggle) toggle.textContent = wasHidden ? '▼' : '▶';
    }

    // 同時に、このフォルダを移動先として選択状態にする
    if (label) {
      container.querySelectorAll('.tree-label.tree-selected').forEach(function (el) { el.classList.remove('tree-selected'); });
      label.classList.add('tree-selected');
      onSelect(label.dataset.selectPath);
    }
  };
}

function openBookEditor(id, currentPath) {
  editTarget = { type: 'book', id: id, oldPath: currentPath || '' };
  document.getElementById('editModalTitle').textContent = '本の分類を変更';
  document.getElementById('editModalCurrent').textContent =
    '現在: ' + (currentPath ? currentPath.replace(/\//g, ' ＞ ') : '(未分類)');
  document.getElementById('editPathInput').value = currentPath || '';
  renderFolderTreePicker('editPathTree', function (path) {
    document.getElementById('editPathInput').value = path;
  });
  document.getElementById('editModal').classList.remove('hidden');
}

function openFolderEditor(path) {
  if (!path) return; // 「未分類」フォルダなど、パスを持たない見出しは対象外
  editTarget = { type: 'folder', oldPath: path };
  document.getElementById('editModalTitle').textContent = 'フォルダごと分類を変更(配下の本すべてが対象)';
  document.getElementById('editModalCurrent').textContent = '現在: ' + path.replace(/\//g, ' ＞ ');
  document.getElementById('editPathInput').value = path;
  renderFolderTreePicker('editPathTree', function (selectedPath) {
    document.getElementById('editPathInput').value = selectedPath;
  });
  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModal').classList.add('hidden');
  editTarget = null;
}

async function submitEdit() {
  if (!editTarget) return;
  const newPath = document.getElementById('editPathInput').value.trim().replace(/^\/+|\/+$/g, '');
  if (!newPath) { alert('フォルダパスを入力してください。'); return; }

  const payload = editTarget.type === 'book'
    ? { action: 'moveBook', id: editTarget.id, newPath: newPath }
    : { action: 'moveFolder', oldPath: editTarget.oldPath, newPath: newPath };

  setStatus('スプレッドシートに反映しています...');
  try {
    const data = await fetchGasJson({
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflightを避けるためtext/plainで送る(doPost側でJSONとしてparseする)
      body: JSON.stringify(payload)
    });
    if (!data.ok) throw new Error(data.error || '不明なエラー');

    // スプレッドシート側と同じ内容でローカルのキャッシュも更新し、画面に即反映する
    const rows = loadLocal();
    if (editTarget.type === 'book') {
      rows.forEach(function (r) { if (String(r['id']) === String(editTarget.id)) r['フォルダパス'] = newPath; });
    } else {
      const oldPath = editTarget.oldPath;
      rows.forEach(function (r) {
        const p = String(r['フォルダパス'] || '');
        if (p === oldPath) r['フォルダパス'] = newPath;
        else if (p.indexOf(oldPath + '/') === 0) r['フォルダパス'] = newPath + p.slice(oldPath.length);
      });
    }
    saveLocal(rows);
    render(rows);
    closeEditModal();
    setStatus('分類を変更しました: ' + new Date().toLocaleString('ja-JP'));
  } catch (e) {
    setStatus('変更の送信に失敗しました: ' + e.message);
    alert('送信に失敗しました。Wi-Fi環境を確認して、もう一度お試しください。(' + e.message + ')');
  }
}

// ------------------------------------------------------------------
// 複数選択して一括でフォルダを移動する確認モーダル
// ------------------------------------------------------------------
function openMoveConfirmModal(books) {
  moveTargetBookIds = books.map(function (b) { return b['id']; });

  const listHtml = books.map(function (b) {
    return '<li>' + escapeHtml(b['タイトル'] || '(無題)') + '</li>';
  }).join('');

  const html =
    '<h2>' + books.length + '冊のフォルダを移動</h2>' +
    '<div class="move-book-list"><ul>' + listHtml + '</ul></div>' +
    '<label>既存のフォルダから選ぶ(タップで展開/選択)</label>' +
    '<div class="folder-tree-picker" id="moveTargetTree"></div>' +
    '<label for="moveTargetInput">または直接入力(「/」区切り)</label>' +
    '<input type="text" id="moveTargetInput" placeholder="漫画/少年漫画/少年ジャンプ/新しいシリーズ名">' +
    '<div class="modal-actions">' +
      '<button class="cancel" onclick="closeMoveModal()">キャンセル</button>' +
      '<button class="submit" onclick="confirmBulkMoveSubmit()">この内容で移動する</button>' +
    '</div>';

  document.getElementById('moveModalBox').innerHTML = html;
  renderFolderTreePicker('moveTargetTree', function (path) {
    document.getElementById('moveTargetInput').value = path;
  });
  document.getElementById('moveModal').classList.remove('hidden');
}

function closeMoveModal() {
  document.getElementById('moveModal').classList.add('hidden');
  moveTargetBookIds = [];
}

async function confirmBulkMoveSubmit() {
  const newPath = document.getElementById('moveTargetInput').value.trim().replace(/^\/+|\/+$/g, '');
  if (!newPath) { alert('移動先のフォルダパスを入力または選択してください。'); return; }
  if (!moveTargetBookIds.length) return;

  setStatus('スプレッドシートに反映しています...');
  try {
    const data = await fetchGasJson({
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'moveBooksBulk', ids: moveTargetBookIds, newPath: newPath })
    });
    if (!data.ok) throw new Error(data.error || '不明なエラー');

    closeMoveModal();
    exitSelectionMode();
    setStatus('移動が完了しました。最新データを取得しています...');
    await syncNow();
  } catch (e) {
    setStatus('移動に失敗しました: ' + e.message);
    alert('移動に失敗しました。(' + e.message + ')');
  }
}

async function syncNow() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  setStatus('通信中... データを取得しています');
  try {
    const data = await fetchGasJson({ cache: 'no-store' });
    // doGetがエラー時に返す { ok:false, error:... } 形式を検知する(正常時は配列が返る)
    if (!Array.isArray(data)) {
      throw new Error((data && data.error) || '予期しない形式のデータが返ってきました。');
    }
    saveLocal(data);

    // 表紙画像をservice worker経由でキャッシュ(表示することでcache-first fetchが走る)
    setStatus('画像をキャッシュしています... (' + data.length + '冊)');
    render(data);

    setStatus('更新完了: ' + new Date().toLocaleString('ja-JP'));
  } catch (e) {
    setStatus('更新に失敗しました: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

function init() {
  const rows = loadLocal();
  const ts = localStorage.getItem(LS_TS_KEY);
  setStatus(ts ? ('最終更新: ' + new Date(ts).toLocaleString('ja-JP')) : 'まだ更新されていません');
  render(rows);
  attachLongPressHandlers();

  if ('serviceWorker' in navigator) {
    // updateViaCache:'none' + update() で、sw.js自体が古いままキャッシュされて
    // 修正が反映されない事態を防ぐ(インストール済みPWAでよくある「直したのに変わらない」原因)
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
    }).catch(function (e) {
      console.warn('service worker登録失敗', e);
    });
  }
}

init();
</script>
